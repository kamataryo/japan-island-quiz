<!doctype html>
<!-- 結果のシェア用の OGP 画像（1200×630）の元。scripts/ogp.ts が ?mode=&score=&count=（&bg=）を付けて開き、モード × 得点ごとに撮る。背景は bg（地域モードの scripts/ogp-bg/）か public/ogp.png -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=block" rel="stylesheet" />
    <link href="../src/styles/tokens.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      .ogp {
        position: relative;
        width: 1200px;
        height: 630px;
        background: url("../public/ogp.png");
        font-family: var(--font-retro);
        color: var(--c-ink);
      }
      /* 背景のタイトル（左下）と島（中央）に重ならない左上に（島の左端が x=480 前後なので、影も含めて 440px までに収める）、アプリと同じ古いウィンドウ風のパネルを置く */
      .window {
        position: absolute;
        top: 40px;
        left: 24px;
        width: 400px;
        border: 3px solid var(--c-btn-dark);
        background: var(--c-panel);
        box-shadow: 8px 8px 0 var(--c-btn-shadow);
      }
      .title {
        margin: 0;
        padding: 6px 16px;
        background: linear-gradient(90deg, var(--c-title), var(--c-title-end));
        color: var(--c-on-title);
        font-size: 30px;
        line-height: 1.3;
      }
      .body {
        padding: 8px 24px 20px;
        text-align: center;
      }
      /* 出題数が多いモードでも1行に収める（収まらなければ script で字を小さくする） */
      .score {
        margin: 0;
        font-size: 44px;
        line-height: 1.1;
        white-space: nowrap;
      }
      .score strong {
        font-size: 140px;
        font-weight: 400;
      }
      /* 得点のゲージ。マスが多すぎると潰れるので、出題数が多いモードでは1本の棒にする */
      .gauge {
        display: flex;
        gap: 6px;
        height: 26px;
        margin: 12px 0 16px;
      }
      .gauge i {
        flex: 1;
        border: 2px solid var(--c-btn-dark);
        background: var(--c-paper);
      }
      .gauge i.on {
        background: var(--c-btn-dark);
      }
      .gauge.bar i {
        background: linear-gradient(90deg, var(--c-btn-dark) var(--p), var(--c-paper) var(--p));
      }
      .cta {
        margin: 0;
        font-size: 30px;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div class="ogp">
      <div class="window">
        <p class="title" id="title"></p>
        <div class="body">
          <p class="score"><strong id="score"></strong> / <span id="count"></span>問正解</p>
          <div class="gauge" id="gauge"></div>
          <p class="cta">同じ<span id="count2"></span>問に挑戦しよう！</p>
        </div>
      </div>
    </div>
    <script>
      const q = new URLSearchParams(location.search);
      const score = Number(q.get("score"));
      const count = Number(q.get("count"));
      if (q.has("bg")) document.querySelector(".ogp").style.backgroundImage = `url("${q.get("bg")}")`;
      document.querySelector("#title").textContent = `結果：${q.get("mode")}`;
      document.querySelector("#score").textContent = score;
      document.querySelector("#count").textContent = count;
      document.querySelector("#count2").textContent = count;
      const gauge = document.querySelector("#gauge");
      // 字の幅はフォントで変わるので、読み込んでから測る（ogp.ts も document.fonts.ready を待ってから撮る）
      document.fonts.ready.then(() => {
        const line = document.querySelector(".score");
        for (let k = 1; line.scrollWidth > line.clientWidth && k > 0.3; k -= 0.05) {
          line.style.fontSize = `${44 * k}px`;
          line.querySelector("strong").style.fontSize = `${140 * k}px`;
        }
      });
      if (count <= 20) {
        gauge.innerHTML = Array.from({ length: count }, (_, i) => `<i${i < score ? ' class="on"' : ""}></i>`).join("");
      } else {
        gauge.classList.add("bar");
        gauge.innerHTML = `<i style="--p: ${(score / count) * 100}%"></i>`;
      }
    </script>
  </body>
</html>
