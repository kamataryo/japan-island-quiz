<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>出題範囲の確認 | 日本の島クイズ</title>
    <style>
      body {
        margin: 0;
      }
      #map {
        height: 100dvh;
      }
      #panel {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
        z-index: 1;
        padding: 0.5rem 0.75rem;
        background: var(--c-paper);
        border: 1px solid var(--c-btn-dark);
        font-size: 0.875rem;
      }
      #panel table {
        border-collapse: collapse;
      }
      #panel {
        max-height: calc(100dvh - 1rem);
        overflow: auto;
      }
      .slider {
        display: grid;
        grid-template-columns: 4em 8em 3em;
        align-items: center;
        gap: 0.25rem;
      }
      #json {
        max-width: 16em;
        font-size: 0.75rem;
        overflow-wrap: anywhere;
      }
      #panel td {
        padding: 0 0.5rem 0 0;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <label>モード <select id="mode"></select></label>
      <div id="stats"></div>
      <details>
        <summary>難易度の調整（試すだけ・保存されません）</summary>
        <p>重み</p>
        <div id="weights"></div>
        <p>帯の比率（合計で割って使う）</p>
        <div id="fractions"></div>
        <code id="json"></code>
      </details>
      <details id="db">
        <summary>みんなの集計（D1）</summary>
        <div id="db-body">読み込み中…</div>
      </details>
    </div>
    <div id="map"></div>
    <script type="module" src="/src/debug.ts"></script>
  </body>
</html>
