# Cloudflare Workers へデプロイする。base.pmtiles は大きいのでリポジトリに入れず、最新の Release から取って R2 に置く
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # dist（静的アセット）に入らないよう public/data の外に置く
      # meta.json に対応する Release を取り、islands.json と組みになっているか確かめる（Release の作り忘れで古い地図のまま公開しないように）
      - run: |
          gh release download "$(node scripts/release-pmtiles.ts --tag)" --pattern base.pmtiles --dir "$RUNNER_TEMP"
          echo "$(node -p 'require("./public/data/meta.json").pmtilesSha256')  $RUNNER_TEMP/base.pmtiles" | sha256sum -c
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm test
      # 結果のシェア用の OGP 画像（モード × 得点ごと）。ランナーに入っている Google Chrome で撮る
      - run: pnpm ogp
      - run: pnpm build
      - run: pnpm wrangler r2 object put japan-island-quiz/base.pmtiles --file "$RUNNER_TEMP/base.pmtiles" --remote
      - run: pnpm wrangler d1 migrations apply japan-island-quiz --remote
      - run: pnpm wrangler deploy
