<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日本の島クイズ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app window">
      <header class="window__title app__title">
        <h1>日本の島クイズ</h1>
        <span id="progress"></span>
      </header>
      <p id="map-desc" class="visually-hidden">
        地図。出題中の島を黄色の塗りと赤い太線で示しています。このクイズは地図を目で見て島を当てる形式のため、地図の内容は読み上げられません。
      </p>
      <section id="map" class="app__map" aria-label="地図" aria-describedby="map-desc"></section>
      <fieldset class="segmented app__mode">
        <legend class="visually-hidden">地図の表示</legend>
        <input type="radio" name="mode" id="mode-plain" />
        <label class="btn" for="mode-plain">白地図</label>
        <input type="radio" name="mode" id="mode-terrain" checked />
        <label class="btn" for="mode-terrain">等高線あり</label>
      </fieldset>
      <main id="panel" class="window__body app__panel"></main>
    </div>
    <div id="live" class="visually-hidden" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
