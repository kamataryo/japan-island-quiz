<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日本の島クイズ</title>
    <meta name="description" content="地図を見て、ハイライトされた島の名前を4択で当てるクイズ。" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- OGP の画像と URL は絶対 URL が必要。公開先が変わったら直す -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="日本の島クイズ" />
    <meta property="og:description" content="地図を見て、ハイライトされた島の名前を4択で当てるクイズ。" />
    <meta property="og:url" content="https://japan-island-quiz.kamataryo.workers.dev/" />
    <meta property="og:image" content="https://japan-island-quiz.kamataryo.workers.dev/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="利尻島が黄色くハイライトされた地図に「日本の島クイズ」のタイトル" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app window">
      <header class="window__title app__title">
        <h1>日本の島クイズ</h1>
        <span id="progress"></span>
      </header>
      <p id="map-desc" class="visually-hidden">
        地図。出題中の島を黄色の塗りと赤い太線で示しています。このクイズは地図を目で見て島を当てる形式のため、地図の内容は読み上げられません。地図はドラッグで移動、ピンチやホイール、拡大・縮小ボタンで拡大縮小できます。
      </p>
      <section id="map" class="app__map" aria-label="地図" aria-describedby="map-desc"></section>
      <main id="panel" class="window__body app__panel"></main>
      <a id="home" class="home retro" href="./" hidden><span aria-hidden="true">◀ </span>タイトルへ戻る</a>
    </div>
    <div id="live" class="visually-hidden" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
